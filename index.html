<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
        <title>Pulse</title>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600&display=swap');

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: #1a0a2e;
                overflow: hidden;
                touch-action: none;
                user-select: none;
                -webkit-user-select: none;
                font-family: 'Fredoka', 'Segoe UI', sans-serif;
            }

            #gameCanvas {
                display: block;
                margin: 0 auto;
            }

            #ui {
                position: absolute;
                top: 20px;
                left: 0;
                right: 0;
                text-align: center;
                color: #fff;
                font-size: 24px;
                font-weight: 400;
                letter-spacing: 1px;
                pointer-events: none;
                z-index: 10;
            }

            #score {
                font-size: 56px;
                font-weight: 600;
                background: linear-gradient(135deg, #ff6b9d, #ffd93d, #7dff7d);
                background-size: 200% auto;
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                animation: scoreShine 3s ease infinite;
                text-shadow: 0 0 30px rgba(255, 107, 157, 0.5);
                filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
            }

            @keyframes scoreShine {
                0%, 100% { background-position: 0% center; }
                50% { background-position: 200% center; }
            }

            #multiplier {
                font-size: 20px;
                font-weight: 500;
                color: #ffd93d;
                opacity: 0;
                transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
                margin-top: 5px;
                text-shadow: 0 0 15px rgba(255, 217, 61, 0.6);
            }

            #multiplier.active {
                opacity: 1;
                animation: multiplierBounce 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            }

            @keyframes multiplierBounce {
                0% { transform: scale(1.5); }
                100% { transform: scale(1); }
            }

            #highScore {
                font-size: 14px;
                font-weight: 400;
                opacity: 0.6;
                margin-top: 8px;
                color: rgba(255, 255, 255, 0.8);
            }

            #powerupIndicator {
                position: absolute;
                top: 130px;
                left: 0;
                right: 0;
                text-align: center;
                pointer-events: none;
            }

            .powerup-active {
                display: inline-block;
                padding: 8px 18px;
                margin: 5px;
                border-radius: 25px;
                font-size: 13px;
                font-weight: 500;
                letter-spacing: 1px;
                animation: powerupPulse 1s infinite;
                box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            }

            @keyframes powerupPulse {
                0%, 100% {
                    opacity: 1;
                    transform: scale(1);
                }
                50% {
                    opacity: 0.85;
                    transform: scale(1.05);
                }
            }

            #message {
                position: absolute;
                bottom: 100px;
                left: 0;
                right: 0;
                text-align: center;
                color: rgba(255, 255, 255, 0.7);
                font-size: 15px;
                font-weight: 400;
                letter-spacing: 1px;
                pointer-events: none;
                text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            }

            #gameOver {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                text-align: center;
                color: #fff;
                display: none;
                pointer-events: none;
                z-index: 20;
                animation: gameOverPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            }

            @keyframes gameOverPop {
                0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
                100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            }

            #gameOver h1 {
                font-size: 42px;
                font-weight: 600;
                margin-bottom: 25px;
                letter-spacing: 3px;
                background: linear-gradient(135deg, #ff6b9d, #ff9f43);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                text-shadow: none;
                filter: drop-shadow(0 4px 8px rgba(255, 107, 157, 0.4));
            }

            #gameOver p {
                font-size: 20px;
                font-weight: 400;
                opacity: 0.85;
                margin-bottom: 12px;
            }

            #newHighScore {
                color: #ffd93d;
                font-size: 16px;
                font-weight: 500;
                letter-spacing: 2px;
                margin-bottom: 18px;
                display: none;
                animation: newHighScoreGlow 1s ease-in-out infinite alternate;
                text-shadow: 0 0 20px rgba(255, 217, 61, 0.6);
            }

            @keyframes newHighScoreGlow {
                0% { opacity: 0.8; transform: scale(1); }
                100% { opacity: 1; transform: scale(1.05); }
            }

            #restartHint {
                font-size: 15px;
                font-weight: 400;
                opacity: 0.5;
                margin-top: 35px;
                animation: restartPulse 2s ease-in-out infinite;
            }

            @keyframes restartPulse {
                0%, 100% { opacity: 0.4; }
                50% { opacity: 0.7; }
            }

            #themeUnlock {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                text-align: center;
                color: #fff;
                display: none;
                pointer-events: none;
                z-index: 25;
                animation: unlockPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            }

            @keyframes unlockPop {
                0% {
                    transform: translate(-50%, -50%) scale(0) rotate(-10deg);
                    opacity: 0;
                }
                50% {
                    transform: translate(-50%, -50%) scale(1.15) rotate(3deg);
                }
                100% {
                    transform: translate(-50%, -50%) scale(1) rotate(0deg);
                    opacity: 1;
                }
            }

            #themeUnlock h2 {
                font-size: 26px;
                font-weight: 600;
                letter-spacing: 2px;
                margin-bottom: 12px;
                background: linear-gradient(135deg, #ffd93d, #ff9f43, #ff6b9d);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }

            #themeUnlock p {
                font-size: 18px;
                font-weight: 400;
                opacity: 0.9;
            }

            #comboPopup {
                position: absolute;
                top: 45%;
                left: 50%;
                transform: translate(-50%, -50%);
                font-size: 38px;
                font-weight: 600;
                letter-spacing: 3px;
                background: linear-gradient(135deg, #ffd93d, #ff9f43);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                pointer-events: none;
                opacity: 0;
                z-index: 15;
                filter: drop-shadow(0 2px 10px rgba(255, 217, 61, 0.5));
            }
        </style>
    </head>
    <body>
        <canvas id="gameCanvas"></canvas>

        <div id="ui">
            <div id="score">0</div>
            <div id="multiplier">x1</div>
            <div id="highScore">BEST: 0</div>
        </div>

        <div id="powerupIndicator"></div>

        <div id="comboPopup"></div>

        <div id="message">HOLD TO GROW • RELEASE TO SHRINK</div>

        <div id="themeUnlock">
            <h2>🎨 THEME UNLOCKED</h2>
            <p id="unlockedThemeName"></p>
        </div>

        <div id="gameOver">
            <h1>GAME OVER</h1>
            <div id="newHighScore">⭐ NEW HIGH SCORE! ⭐</div>
            <p>SCORE: <span id="finalScore">0</span></p>
            <p>BEST: <span id="bestScore">0</span></p>
            <div id="restartHint">TAP TO RESTART</div>
        </div>

        <script type="module" src="src/main.js"></script>
    </body>
</html>
